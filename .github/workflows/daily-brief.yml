name: Daily Brief Pipeline

on:
  schedule:
    # 每天北京时间 05:23 触发（UTC 21:23），避开整点高峰延迟
    - cron: '23 21 * * *'
  workflow_dispatch: # 允许在 GitHub 网页版随时手动点击运行

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate LLM secrets
        env:
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
        run: |
          [ -n "$LLM_API_KEY" ]  || { echo "::error::LLM_API_KEY empty"; exit 1; }
          [ -n "$LLM_BASE_URL" ] || { echo "::error::LLM_BASE_URL empty"; exit 1; }
          [ -n "$LLM_MODEL" ]    || { echo "::error::LLM_MODEL empty"; exit 1; }
          echo "model=$LLM_MODEL  base=${LLM_BASE_URL%/}"
          
      - name: Run fetch and AI processing
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          MAX_DAILY_ITEMS: "35"
        run: python scripts/main.py

      - name: Commit and push updated data
        run: |
          git config user.name "Personal Hub Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily brief $(date +'%Y-%m-%d')" && git push)
