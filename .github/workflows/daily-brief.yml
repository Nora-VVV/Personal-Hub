name: Daily Brief Pipeline

on:
  schedule:
    # 每天北京时间 05:23 触发（UTC 21:23），避开整点高峰延迟
    - cron: '23 21 * * *'
  workflow_dispatch: # 允许在 GitHub 网页版随时手动点击运行

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate LLM secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          [ -n "$LLM_API_KEY" ] || { echo "::error::LLM_API_KEY secret is empty"; exit 1; }
          BASE="https://api.deepseek.com/v1"
          MODEL="deepseek-flash"
          echo "model=[$MODEL] base=[$BASE] keylen=${#LLM_API_KEY}"
          resp=$(curl -sS -X POST "$BASE/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer $LLM_API_KEY" -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}" -w "\nHTTPCODE:%{http_code}" 2>&1) || echo "curl_exit=$?"
          echo "$resp"
          echo "$resp" | grep -q "HTTPCODE:200" || { echo "::error::DeepSeek rejected the probe request"; exit 1; }
          
      - name: Run fetch and AI processing
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-flash
          MAX_DAILY_ITEMS: "35"
        run: python scripts/main.py

      - name: Commit and push updated data
        run: |
          git config user.name "Personal Hub Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily brief $(date +'%Y-%m-%d')" && git push)
